openapi: 3.0.3
info:
  title: 墨羽Canvas HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: admin
  - name: newapi
  - name: skill-market
  - name: agent-ops
  - name: assistant
  - name: creation-conversations
  - name: lan-sharing
paths:
  /lan-sharing/status:
    get:
      tags: [lan-sharing]
      summary: 读取本机局域网共享状态
      description: 仅桌面配置注册此路由；返回稳定节点指纹、本机设备显示名称、运行状态、主监听地址、实际成功监听的私有 IPv4 地址、成功发布 mDNS 的地址及有效的一次性配对码。nickname 为空时为系统设备名称。mDNS 组播逐网卡发布，不会默认跨子网转发。
      responses:
        "200": { description: 信封 data 为局域网共享状态，包含 nodeId、nickname、enabled、endpoint、endpoints、advertisedEndpoints、pairingCode 和 pairingCodeExpiresAt }
        "403": { description: 需要受信任的桌面界面 }
  /lan-sharing/nickname:
    put:
      tags: [lan-sharing]
      summary: 设置本机局域网设备名称
      description: 名称只用于显示，不改变公钥指纹身份。空字符串会清除自定义名称并回退系统设备名称；运行中的 mDNS 广告立即更新。此字段独立于可信设备记录中的本地备注。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string, maxLength: 80, description: 空字符串表示使用系统设备名称 }
      responses:
        "200": { description: 信封 data 为更新后的局域网共享状态 }
        "400": { description: 设备名称请求无效 }
        "403": { description: 需要受信任的桌面界面 }
        "404": { description: 本机 LAN 身份记录不存在 }
  /lan-sharing/start:
    post:
      tags: [lan-sharing]
      summary: 启动局域网直连服务
      description: 启动私有 IPv4 上的 TLS/TCP peer 服务和尽力而为的 mDNS 发现；发现不可用时仍可手动配对。
      responses:
        "200": { description: 信封 data 为启动后的状态和一次性配对码 }
        "500": { description: 本机网络接口或监听器启动失败 }
        "403": { description: 需要受信任的桌面界面 }
  /lan-sharing/stop:
    post:
      tags: [lan-sharing]
      summary: 停止局域网直连服务
      responses:
        "200": { description: 信封 data.enabled 为 false }
        "403": { description: 需要受信任的桌面界面 }
  /lan-sharing/peers:
    get:
      tags: [lan-sharing]
      summary: 列出发现及受信任设备
      responses:
        "200": { description: 信封 data 包含 discovered 与 trusted；可信设备包含最后已知 IPv4 地址和端口 }
        "403": { description: 需要受信任的桌面界面 }
  /lan-sharing/pair:
    post:
      tags: [lan-sharing]
      summary: 使用一次性配对码建立设备互信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerId, address, port, pairingCode, nickname]
              properties:
                peerId: { type: string, pattern: "^[a-f0-9]{64}$" }
                address: { type: string, format: ipv4, description: RFC1918 私有 IPv4 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                pairingCode: { type: string }
                nickname: { type: string, maxLength: 80 }
      responses:
        "200": { description: 信封 data.peer 为已配对设备 }
        "400": { description: 配对请求无效 }
        "403": { description: 需要受信任的桌面界面 }
        "409": { description: 配对码无效、已过期或设备身份冲突 }
  /lan-sharing/peers/{peerId}:
    delete:
      tags: [lan-sharing]
      summary: 撤销可信设备
      parameters:
        - in: path
          name: peerId
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: 信封 data.peerId 为已撤销设备 }
        "404": { description: 设备不存在或未处于可信状态 }
  /lan-sharing/catalogs:
    get:
      tags: [lan-sharing]
      summary: 列出共享清单
      responses:
        "200": { description: 信封 data.catalogs 为清单摘要；updateCount 表示已同步的 Yjs 更新记录数，不代表当前资产条目数 }
    post:
      tags: [lan-sharing]
      summary: 创建共享清单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: 信封 data.catalog 为新清单 }
        "400": { description: 清单名称无效 }
  /lan-sharing/catalogs/{catalogId}/updates:
    get:
      tags: [lan-sharing]
      summary: 分页读取本机已接收的 Yjs 更新
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: 信封 data 包含 updates、cursor 与 hasMore }
        "404": { description: 清单不存在 }
    post:
      tags: [lan-sharing]
      summary: 保存一个本地 Yjs 更新并向可信设备同步
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updateBase64]
              properties:
                updateBase64: { type: string, format: byte, description: 单个 Yjs 二进制更新的 Base64，解码后最多 4 MiB }
      responses:
        "200": { description: 信封 data.accepted 表示新更新已保存；重复更新返回 false }
        "400": { description: 更新无效或过大 }
        "404": { description: 清单不存在 }
  /lan-sharing/canvases:
    get:
      tags: [lan-sharing]
      summary: 列出局域网协作画布
      description: 返回已配对可信节点可见的协作房间；正文由独立 Yjs 文档表示，不使用个人画布的修订号或历史。
      responses:
        "200": { description: 信封 data.canvases 为协作画布摘要 }
        "403": { description: 需要受信任的桌面界面 }
    post:
      tags: [lan-sharing]
      summary: 新建协作画布或从个人画布复制
      description: 客户端提交复制后的首个 Yjs 更新；可附关联的共享素材清单 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                assetCatalogId: { type: string, description: 由协作画布引用素材使用的共享资源清单 ID }
                initialUpdateBase64: { type: string, format: byte, description: 可选的首个 Yjs 文档更新，解码后最多 4 MiB }
      responses:
        "200": { description: 信封 data.canvas 为新协作画布 }
        "400": { description: 名称、素材清单或首个文档更新无效 }
        "404": { description: 素材清单不存在 }
  /lan-sharing/canvases/{canvasId}:
    patch:
      tags: [lan-sharing]
      summary: 重命名、归档或恢复协作画布
      description: 仅画布创建节点可修改管理元数据。
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                archived: { type: boolean }
      responses:
        "200": { description: 信封 data.canvas 为更新后的画布 }
        "403": { description: 当前设备不是创建者 }
        "404": { description: 画布不存在 }
    delete:
      tags: [lan-sharing]
      summary: 删除协作画布
      description: 仅画布创建节点可删除；以墓碑同步，不改动个人画布。
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 协作画布删除完成 }
        "403": { description: 当前设备不是创建者 }
        "404": { description: 画布不存在 }
  /lan-sharing/canvases/{canvasId}/updates:
    get:
      tags: [lan-sharing]
      summary: 分页读取协作画布 Yjs 更新
      description: 已删除房间返回 404，不再提供更新日志读取。
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: 信封 data 包含 updates、cursor 与 hasMore }
        "404": { description: 画布不存在 }
    post:
      tags: [lan-sharing]
      summary: 持久化协作画布的 Yjs 更新
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updateBase64]
              properties:
                updateBase64: { type: string, format: byte, description: 解码后最多 4 MiB；重复更新按 SHA-256 去重 }
      responses:
        "200": { description: 信封 data.accepted 表示新更新已保存 }
        "400": { description: 更新无效或过大 }
        "404": { description: 画布不存在 }
  /lan-sharing/canvases/{canvasId}/stream-ticket:
    post:
      tags: [lan-sharing]
      summary: 签发一次性协作流票据
      description: WebSocket 无法携带桌面认证头；由受信任桌面请求取得 30 秒有效的一次性票据，票据绑定画布。
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 信封 data 包含 ticket 与 expiresInSeconds }
        "404": { description: 画布不存在 }
  /lan-sharing/canvases/{canvasId}/stream:
    get:
      tags: [lan-sharing]
      summary: 打开协作画布本地实时流
      description: 同源 WebSocket，使用一次性 ticket 查询参数；update 帧持久化后推送，presence 帧仅临时转发。
      parameters:
        - in: path
          name: canvasId
          required: true
          schema: { type: string }
        - in: query
          name: ticket
          required: true
          schema: { type: string }
      responses:
        "101": { description: WebSocket upgrade 成功 }
        "403": { description: 票据无效或已过期 }
  /lan-sharing/catalogs/{catalogId}/assets:
    post:
      tags: [lan-sharing]
      summary: 将当前用户拥有的本地资源加入共享清单
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: { type: string }
                entryId: { type: string }
                name: { type: string, maxLength: 255 }
      responses:
        "200": { description: 信封 data.asset 含 SHA-256 与资产元数据 }
        "400": { description: 资源未就绪、非本地归属或大小超出限制 }
        "404": { description: 清单或资源不存在 }
  /lan-sharing/catalogs/{catalogId}/assets/status:
    get:
      tags: [lan-sharing]
      summary: 查询当前桌面工作区的本机共享素材文件状态
      description: 桌面应用启动时和随后每 5 分钟巡检文件存在性，与共享服务开关无关；状态不是持续的完整内容哈希校验，也不证明远端设备仍持有文件。
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.assets 为本机素材映射的文件状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      assets:
                        type: array
                        items:
                          type: object
                          required: [contentHash, resourceId, availability]
                          properties:
                            contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                            resourceId: { type: string }
                            availability: { type: string, enum: [present, missing, unknown] }
                            checkedAt: { type: string, format: date-time, nullable: true }
        "404": { description: 共享清单不存在 }
  /lan-sharing/catalogs/{catalogId}/assets/import:
    post:
      tags: [lan-sharing]
      summary: 从受信任 peer 直连导入资产到本地资源库
      description: TLS 证书按节点指纹固定；字节流经 TCP 直传并在写入资源库前验证 SHA-256 和长度。
      parameters:
        - in: path
          name: catalogId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerId, address, port, contentHash, name, mimeType, size]
              properties:
                peerId: { type: string, pattern: "^[a-f0-9]{64}$" }
                address: { type: string, format: ipv4, description: RFC1918 私有 IPv4 }
                port: { type: integer, minimum: 1, maximum: 65535 }
                contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                name: { type: string, maxLength: 255 }
                mimeType: { type: string, maxLength: 120 }
                size: { type: integer, minimum: 1 }
      responses:
        "200": { description: 信封 data.resource 为接收端自己的本地资源记录 }
        "400": { description: 资产元数据无效 }
        "403": { description: peer 未建立信任 }
        "404": { description: 清单或 peer 侧资产不存在 }
        "413": { description: 资产超过本地资源限制 }
        "502": { description: 直连传输或校验失败 }
  /business/tools:
    get:
      tags: [agent-ops]
      summary: Discover mounted business tools available to external clients
      description: |
        A registered external client uses X-Beeftv-Client and its Bearer token.
        The response lists mounted business handlers and their method, path, query,
        body schemas, readOnly flag, and generation cost hints. External clients
        manage execution approval. Identity, ownership, balance, validation and
        revision checks still run in the existing handlers. Legacy read-only
        credentials cannot execute writes. A listed handler may return
        FeatureUnavailable when its feature is disabled.
      parameters:
        - in: header
          name: X-Beeftv-Client
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          description: Bearer registered-client token
          schema: { type: string }
      responses:
        "200":
          description: Envelope data contains tools, readOnly, authentication and approval
        "403":
          description: Invalid client, forbidden origin or unavailable local identity
  /projects/{id}/chapter-apply-receipts:
    get:
      tags: [projects]
      summary: 查询章节生成结果的持久化写入回执
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: taskIds
          description: 逗号分隔的生成任务 ID，最多 100 个
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.receipts 含 taskId、op、kind、applied；只返回本项目已提交回执
        "404":
          description: 项目不存在或不属于当前用户
        "500":
          description: 回执无法读取，不推断结果已应用
  /creation-conversations:
    get:
      tags: [creation-conversations]
      summary: 列出当前工作区未删除的创作对话
      description: 返回已提交对话文档与墓碑 ID。IndexedDB 不是提交事实。
      responses:
        "200":
          description: 信封 data 为 conversations 与 deletedIds
  /creation-conversations/import:
    post:
      tags: [creation-conversations]
      summary: 按稳定操作标识导入本地历史对话
      description: 仅在没有后端记录或墓碑时导入；同一 operationId 与哈希可重放。
      responses:
        "200":
          description: 信封 data 含 imported 与对话记录
        "409":
          description: 同一操作标识对应不同内容
  /creation-conversations/{id}:
    get:
      tags: [creation-conversations]
      summary: 读取一条未删除的创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 为 revision 与 document
        "404":
          description: 不存在或已删除
    put:
      tags: [creation-conversations]
      summary: 按 expectedRevision 提交一条创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 新 revision
        "409":
          description: 版本冲突或墓碑拒绝复活
    delete:
      tags: [creation-conversations]
      summary: 为创作对话写入墓碑
      description: 不删除关联任务或素材。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedRevision
          schema: { type: integer }
      responses:
        "200":
          description: 墓碑已写入
  /newapi/connection/sync:
    post:
      tags: [newapi]
      summary: 登录 New API 并同步模型渠道
      description: 仅受信任的本机 UI 可调用；精确复用或创建 videoCanvas Key，并将 New API 全量模型目录写入本地 provider 配置。
      responses:
        "200":
          description: 信封 data.channel 包含已同步的渠道配置，data.modelCount 为模型数
        "403":
          description: 调用方不是受信任的本机 UI
        "502":
          description: New API 登录、Key 管理或模型目录请求失败
  /skills/market/search:
    get:
      tags: [skill-market]
      summary: 搜索公共技能市场
      description: 只读取配置的公共市场，不携带桌面账号、模型密钥或发布凭据。
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 信封 data 含匹配技能、总数和分页信息
        "502":
          description: 公共技能市场返回错误或不可读取
        "503":
          description: 公共技能市场暂时不可连接
  /skills/market/catalog:
    get:
      tags: [skill-market]
      summary: 浏览公共技能市场目录
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 信封 data 含公共技能发布版本目录
        "502":
          description: 公共技能市场返回错误或不可读取
        "503":
          description: 公共技能市场暂时不可连接
  /skills/market/releases/{skillId}/{releaseId}:
    get:
      tags: [skill-market]
      summary: 查看技能发布版本及文件清单
      parameters:
        - in: path
          name: skillId
          required: true
          schema: { type: string }
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 含元信息、内容摘要、下载包摘要和逐文件摘要
        "400":
          description: 技能或版本标识无效
        "502":
          description: 公共技能市场返回错误或不可读取
  /skills/market/releases/{skillId}/{releaseId}/file:
    get:
      tags: [skill-market]
      summary: 分段读取技能发布版本中的文本文件
      parameters:
        - in: path
          name: skillId
          required: true
          schema: { type: string }
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: 信封 data 含内容、编码、结束标记和下一偏移量
        "400":
          description: 文件路径或读取范围无效
        "502":
          description: 公共技能市场返回错误或不可读取
  /skills/market/install:
    post:
      tags: [skill-market]
      summary: 下载并安装指定公共技能版本
      description: 写入前校验下载包 SHA-256、内容摘要、逐文件摘要、ZIP 边界和客户端兼容性。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, releaseId]
              properties:
                skillId: { type: string }
                releaseId: { type: string }
      responses:
        "200":
          description: 信封 data.skill 为安装后的本地技能
        "400":
          description: 发布版本不兼容或请求无效
        "409":
          description: 下载包、内容或文件摘要校验失败
        "502":
          description: 公共技能市场返回错误或不可读取
  /skills/market/versions/{skillId}:
    get:
      tags: [skill-market]
      summary: 查看已安装技能的本地版本历史
      parameters:
        - in: path
          name: skillId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.versions 为本地版本历史
        "403":
          description: 技能不属于当前工作区用户
  /skills/market/fork:
    post:
      tags: [skill-market]
      summary: 将已安装技能复制为本地私有改写
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId]
              properties:
                skillId: { type: string }
      responses:
        "200":
          description: 信封 data.skill 为新的本地私有技能
        "400":
          description: 技能包无法读取或请求无效
  /skills/market/rollback:
    post:
      tags: [skill-market]
      summary: 将已安装技能恢复到一个本地历史版本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, versionId]
              properties:
                skillId: { type: string }
                versionId: { type: string }
      responses:
        "200":
          description: 信封 data.skill 为恢复后的本地技能
        "400":
          description: 历史版本不存在或请求无效
        "403":
          description: 技能不属于当前工作区用户
  /canvas-folders:
    get:
      tags: [canvas]
      summary: 列出当前用户的画布文件夹
      responses:
        "200":
          description: 信封 data.folders 为文件夹列表，封面为资源 ID
  /canvas-folders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [canvas]
      summary: 创建或更新画布文件夹
      description: 已删除的文件夹 ID 不能重新导入。封面必须是当前用户已就绪的资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: object
                  required: [name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    coverResourceId: { type: string }
      responses:
        "200":
          description: 信封 data.folder 为保存后的文件夹
        "400":
          description: 名称、ID 或封面资源不合法
        "409":
          description: 文件夹已删除，不能用原 ID 重建；本地草稿由前端保留并决定恢复方式
    delete:
      tags: [canvas]
      summary: 删除画布文件夹并清空画布归属
      description: 删除会递增仍指向该文件夹的画布 revision，并更新画布正文中的 folderId。重复删除已删除的文件夹返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的文件夹
        "404":
          description: 文件夹不存在或不属于当前用户
  /canvas-projects/{id}/drawings:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 列出画布下的画板摘要（不含快照正文）
      responses:
        "200":
          description: 信封 data.drawings 为画板摘要
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/drawings/{drawingId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: drawingId
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取画板快照与 revision
      responses:
        "200":
          description: 信封 data.drawing 含 snapshot、revision 与预览/成品资源 ID
        "404":
          description: 画布或画板不存在
    put:
      tags: [canvas]
      summary: 按 revision 保存画板快照
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。丢失应答后用同一请求重试会回放已提交结果。已删除的画板不能用原 ID 重新导入；前端应保留可恢复草稿并决定恢复方式，不得自动按原 ID 写回。请求体上限为账号画布和素材数据上限加 JSON 信封余量，写入按同一上限核算字节，没有单独的 8MB 画板上限。预览和成品必须是当前用户已就绪的资源 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drawing]
              properties:
                drawing:
                  type: object
                  required: [revision]
                  properties:
                    drawingId: { type: string }
                    engine: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                    snapshot: { type: object }
                    previewResourceId: { type: string }
                    render:
                      type: object
                      properties:
                        resourceId: { type: string }
      responses:
        "200":
          description: 信封 data.drawing 返回递增后的 revision
        "400":
          description: 画板、引擎或资源引用不合法，或 JSON 无法解析
        "403":
          description: 账号画布和素材数据已达上限
        "409":
          description: 版本冲突，或画板已删除不能用原 ID 重新导入；reason 为 conflict 表示 CAS，failed_precondition 表示已删除。已删除时前端保留可恢复草稿，不自动按原 ID 写回
        "428":
          description: 缺少 revision
    delete:
      tags: [canvas]
      summary: 删除画板快照
      description: 删除写入墓碑并释放预览/成品资源引用。重复删除已删除的画板返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的画板
        "404":
          description: 画布或画板不存在
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "404":
          description: 画布不存在或不属于当前用户
    put:
      tags: [canvas]
      summary: 按 revision 保存画布内容
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。忽略客户端 viewport 和 remoteContentHash，updatedAt 由服务端生成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  properties:
                    id: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                  additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回摘要及递增后的 revision
        "400":
          description: 请求、版本或素材引用不合法
        "409":
          description: 版本或资源状态冲突，原内容未被覆盖；保留草稿后加载最新版
        "428":
          description: 缺少 revision，需刷新客户端并重新读取
  /canvas-projects/{id}/history:
    get:
      tags: [canvas]
      summary: 读取当前画布版本与最近 20 份历史摘要
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 currentRevision 和 snapshots；每项含 id、revision、title、nodeCount、connectionCount、payloadBytes、reason、contentUpdatedAt、createdAt，不含正文
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/history/{snapshotId}:
    get:
      tags: [canvas]
      summary: 按需读取历史正文
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 snapshot 摘要和 project 正文
        "404":
          description: 画布或快照不存在、已过期或无权访问
  /canvas-projects/{id}/history/{snapshotId}/restore:
    post:
      tags: [canvas]
      summary: 备份当前内容并将历史内容恢复为新版本
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 信封 data.project 返回恢复后的摘要及新 revision；当前 ID、归属与项目关联保留
        "404":
          description: 画布或快照不存在、已过期或无权访问
        "409":
          description: 当前版本或素材状态已变化，恢复未执行
        "428":
          description: 缺少当前 revision
  /ops:
    get:
      tags: [agent-ops]
      summary: 列出调用者身份可用的操作描述（含 JSON Schema）
      description: |
        能力模式只由调用者身份决定：已登记客户端的模式来自服务端登记，请求体或查询参数都不能提升权限。
        只读客户端只会拿到 readOnly 操作；写操作在 /ops/{op} 上仍按登记权限强制拒绝。
      responses:
        "200":
          description: 信封 data.ops 为操作描述数组，data.readOnly 表示本次调用的能力模式
        "403":
          description: 非本机同源，或身份不足（缺少已登记客户端凭据与 owner 凭据）
  /ops/{op}:
    post:
      tags: [agent-ops]
      summary: 执行单个操作（CLI、MCP 与内置 pi 会话共用）
      description: |
        写操作必须提供 opId 作为幂等键：同一 opId 同参数回读原结果，不同参数返回冲突。
        写操作还必须在 params 里带上读取时的 expectedRevision：缺少或已过期都会被拒绝，
        不会覆盖别人刚写入的内容。字段落点由画布能力描述符声明（例如生成类节点的可编辑
        提示词落在 metadata.composerContent），操作层不自行拼文档形状。
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
          description: 操作 ID，例如 canvas.get、canvas.nodes.create、canvas.node.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opId:
                  type: string
                  description: 写操作的幂等键；只读操作不接受该字段
                params:
                  type: object
                  description: 操作参数，形状以 GET /ops 返回的 JSON Schema 为准
      responses:
        "200":
          description: 信封 data 为操作结果；data.replayed=true 表示命中了幂等回放
        "400":
          description: 参数错误；reason=unsupported_field 表示该节点类型没有这个可编辑字段（整批不写）
        "409":
          description: 同一 opId 用于不同请求内容，或 revision 已过期（reason=stale_revision）
        "412":
          description: 缺少读取时的 expectedRevision
        "403":
          description: 只读客户端尝试写操作（reason=read_only_client），或身份不足
  /assistant/status:
    get:
      tags: [assistant]
      security: []
      summary: 内置创作助手宿主状态（免身份、不含凭据）
      responses:
        "200":
          description: 信封 data 为 { available, reason?, url?, health? }；未就绪时给出明确原因
  /assistant/ui-session:
    post:
      tags: [assistant]
      summary: 签发短期限 UI 会话凭据
      description: 需本机同源，并出示 owner 凭据（或本机显式的开发引导开关）。
      responses:
        "200":
          description: 信封 data.token 为绑定当前 owner 的短期限凭据，data.expiresAt 为到期时间；只应保存在内存里并在到期前续签
        "403":
          description: 非本机同源，或既没有 owner 凭据也没有显式本地引导
  /assistant/chat:
    post:
      tags: [assistant]
      summary: 流式对话（NDJSON）
      description: |
        请求头 X-Beeftv-Ui-Session 由 /assistant/ui-session 签发。响应为 NDJSON：
        若干 text_delta 增量，最后恰好一条 turn_end 结算（含 reply、toolCalls、error、cancelled）。
        宿主凭据与模型密钥由后端注入，浏览器不接触。
        X-Beeftv-Turn-Admission 响应头为 rejected（尚未尝试创建业务轮次）、unknown（已尝试创建）或 admitted（已创建）。
        只有 rejected 可以确认未接纳；缺少标记、网络故障或接纳后失败仍需读取回执。续签凭据不会重放消息。
        可选 requestId（[A-Za-z0-9_-]{1,128}）标识这次发送：停止可以指向它，同一会话里同一 requestId 重发不会再执行。
        它不代替后端生成的 turnId；格式不对返回 400（rejected）。
      responses:
        "200":
          description: application/x-ndjson 事件流
        "403":
          description: 缺少或过期的 UI 会话凭据
        "503":
          description: 宿主未配置或不可达（reason=host_token_missing / host_unreachable）
  /assistant/cancel:
    post:
      tags: [assistant]
      summary: 停止一次发送，或指定画布正在进行的回合
      description: |
        需要写权限，并且 canvasId 必须属于当前工作区。只读客户端不能取消。
        带 sessionId 与 requestId（必须成对）时只停止这次发送，即使它还没到达宿主；
        信封 data.state 为 stopped（正在执行，已停下）、finished（已经结束）或 pending（还没开始执行，之后也不会执行）。
        不带这两个字段时停止该画布正在进行的回合。
      responses:
        "202":
          description: 已受理取消
        "400":
          description: sessionId 与 requestId 不成对或格式无效
        "403":
          description: 只读客户端，或缺少写权限
        "404":
          description: 画布不存在或不属于当前工作区；会话不属于该画布；或不带请求标识时该画布没有正在进行的会话
  /assistant/host/config:
    get:
      tags: [assistant]
      summary: 读取宿主配置（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data 为 { config, configured, supervisorRunning }
        "403":
          description: 缺少 owner 凭据
    put:
      tags: [assistant]
      summary: 写入宿主配置（当前文本模型与宿主启动命令）
      description: 只写入本机配置文件；启动命令永远不来自请求体。
      responses:
        "200":
          description: 信封 data.config 为写入后的配置
        "403":
          description: 缺少 owner 凭据
  /assistant/host/start:
    post:
      tags: [assistant]
      summary: 启动内置宿主（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data.pid 为本进程启动的宿主进程号
        "503":
          description: 未配置启动命令（reason=host_command_missing）或启动失败
  /assistant/host/stop:
    post:
      tags: [assistant]
      summary: 停止本进程启动的内置宿主
      description: 只停止本进程启动过的子进程；应用关闭时会自动执行同样的清理。
      responses:
        "200":
          description: 信封 data.stopped=true
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [auth]
      summary: 当前登录会话
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 登录并设置会话 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/{id}/playback:
    post:
      tags: [resources]
      summary: 按需准备当前用户视频预览
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/playback-cache:
    delete:
      tags: [resources]
      summary: 清理当前用户已完成的视频预览缓存
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /timeline/render-plan:
    post:
      tags: [tasks]
      summary: 编译时间线语义渲染计划
      description: |
        只读规划：根据时间线快照与不透明源元数据返回版本化语义计划。
        不排队、不落盘、不计费，不接受 ffmpeg 参数或本地路径。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /timeline/renders:
    post:
      tags: [tasks]
      summary: 创建本机时间线渲染任务
      description: 接收时间线快照与输出选项（宽高、帧率、采样率、是否烧录字幕）。选项写入任务输入，由本机 ffmpeg 按语义计划执行。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /timeline/transcriptions:
    post:
      tags: [tasks]
      summary: 创建本机字幕转写任务
      description: 接收待转写素材编号和可选语言。只接受当前用户已上传完成的音视频。省略 model 使用本地 whisper.cpp，指定 model 使用本地 newapi 渠道目录中的 audio.transcriptions 模型，音轨提取后最多 25 MiB。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /depth-captures:
    post:
      tags: [tasks]
      summary: 创建本机深度动作捕捉任务
      description: 接收待处理视频素材编号。只接受当前用户已上传完成的视频。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 任务详情
      description: 生成结果正在取回时，data.delivery.outputs[] 给出每个输出的 downloadedBytes、totalBytes（未知为 -1）、bytesPerSecond 和 state（downloading / retrying / waiting）。waiting 表示服务端明确回复文件尚未就绪，retrying 表示下载出错后等待重试。字节数仅计入成功响应的文件内容。这是进程内存里的实时进度，不写数据库，取回结束即消失。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          description: 任务不存在或无权访问
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/{id}:
    delete:
      tags: [assets]
      summary: 删除无业务引用的素材
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedStatus
          schema: { type: string, enum: [archived] }
          description: 清空回收站时传 archived；事务内核对状态，已还原的素材返回 409 并保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          description: 无效的状态条件
        "409":
          description: 素材状态已变化或仍有业务引用，未删除
components:
  parameters:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - local_storage_failed
                - local_credential_failed
                - local_disk_full
                - bad_gateway
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
